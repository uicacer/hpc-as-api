[extend]
useDefault = true

# ── Custom rules ─────────────────────────────────────────────────────────────

[[rules]]
id = "hpc-as-api-stream-key"
description = "hpc-as-api / streamrelay API key"
regex = '''sk-stream-[a-zA-Z0-9_-]{16,}'''
tags = ["api-key", "hpc-as-api"]

[[rules]]
id = "relay-secret-hex"
description = "RELAY_SECRET or RELAY_ENCRYPTION_KEY value (64-char hex)"
regex = '''(?i)(relay_secret|relay_encryption_key)\s*=\s*[0-9a-f]{40,}'''
tags = ["secret", "relay"]

# ── Allowlists ───────────────────────────────────────────────────────────────

[[allowlists]]
description = "Placeholder/example credentials in tutorial and documentation"
paths = [
    "docs/tutorial.ipynb",
    "docs/deployment.md",
]
regexes = [
    # Generic placeholders
    '''YOUR[-_]API[-_]KEY''',
    '''<your[-_]api[-_]key>''',
    # Placeholder sk-stream- keys: x, y, or z repeated 8+ times after prefix
    '''sk-stream-[a-z]+-[xyzXYZ]{8,}''',
    '''sk-your[-_]''',
    # Hex placeholders (e.g. 000...000 or aaa...aaa)
    '''[0-9a-f]{40,}''',
]

[[allowlists]]
description = "Rotated key in benchmarks/TUNING.md (commit bffd755) — already revoked, benchmarks folder removed"
commits = ["bffd7554550cbed3c94dc582e77e72b8868d2435"]
