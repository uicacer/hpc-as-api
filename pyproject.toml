[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpc-as-api"
version = "0.6.3"
description = "Domain-agnostic HTTP gateway for any HPC function via Globus Compute + WebSocket relay"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Anas Nassar", email = "nassar@uic.edu" },
]
keywords = ["hpc", "globus-compute", "streaming", "api-gateway", "slurm", "scientific-computing", "domain-agnostic", "llm", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "websockets>=13.0",
    "cryptography>=43.0",
    "streamrelay>=0.3.1",
]

[project.optional-dependencies]
globus = [
    "globus-compute-sdk>=2.0",
    "globus-sdk>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.28",
    "ruff",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[project.scripts]
hpc-as-api = "hpc_as_api.cli:main"

[project.urls]
Homepage = "https://github.com/uicacer/hpc-as-api"
Repository = "https://github.com/uicacer/hpc-as-api"
"Bug Tracker" = "https://github.com/uicacer/hpc-as-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["hpc_as_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/*.ipynb", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",  # assert statements (used in tests)
    "S603",  # subprocess without shell=True (false positive pattern)
    "B008",  # function calls in default arguments (FastAPI uses this pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]  # relax security/bugbear rules in tests

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
]
